# Render Blueprint for Treasury Register — FREE TIER.
#
# Two web services, no persistent disk:
#   - tms-backend  (FastAPI, SQLite in the ephemeral container filesystem)
#   - tms-frontend (Next.js)
#
# Free tier trade-offs:
#   * Services sleep after 15 min idle (~30s cold start on next hit)
#   * No persistent disk — SQLite lives inside the container and is
#     wiped on every restart. bootstrap.sh runs `alembic upgrade head`
#     and reseeds an empty book on boot, so a fresh demo state comes
#     up cleanly each time. Absolutely fine for a demo; not for prod.

services:
  # ------------------------------------------------------------------
  # Backend — FastAPI + SQLite (ephemeral)
  # ------------------------------------------------------------------
  - type: web
    name: tms-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/bootstrap.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: TREASURY_DATABASE_URL
        value: sqlite:///./treasury.db     # relative to backend/, ephemeral
      - key: TREASURY_MODEL_NAME
        value: openai/gpt-oss-120b
      - key: TREASURY_MODEL_API_KEY
        sync: false                         # set in the Render dashboard

  # ------------------------------------------------------------------
  # Frontend — Next.js
  # ------------------------------------------------------------------
  - type: web
    name: tms-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start -- -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TREASURY_API_ORIGIN
        value: https://tms-backend-iyvb.onrender.com
        # Render's private-network hostname (fromService.hostport) is a
        # paid-tier feature; on free plans it does not resolve. We point
        # the Next.js rewrite at the backend's public URL instead — same
        # traffic, one extra TLS hop, no other change.
